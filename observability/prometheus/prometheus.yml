global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Descoberta via DNS: cada nome resolve para todas as réplicas do serviço,
  # então o Prometheus coleta /metrics de cada instância separadamente.
  - job_name: microservices
    dns_sd_configs:
      - names: [auth-service, catalog-service, booking-service, notification-service]
        type: A
        port: 3000
        refresh_interval: 15s

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: gateway
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
