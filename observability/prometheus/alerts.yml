groups:
  - name: agenda
    rules:
      - alert: InstanciaForaDoAr
        expr: up{job="microservices"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instância {{ $labels.instance }} fora do ar"
          description: "O Prometheus não consegue coletar métricas de {{ $labels.instance }} há mais de 1 minuto."

      - alert: ReplicasAbaixoDoMinimo
        expr: sum by (service) (up{job="microservices"}) < 2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} com menos de 2 réplicas saudáveis"

      - alert: TaxaDeErroAlta
        expr: |
          sum by (service) (rate(http_requests_total{status_code=~"5.."}[5m]))
            / sum by (service) (rate(http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Taxa de erro 5xx acima de 5% em {{ $labels.service }}"

      - alert: LatenciaAlta
        expr: |
          histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 de latência acima de 500 ms em {{ $labels.service }}"

      - alert: FilaDeNotificacoesAcumulando
        expr: sum(rabbitmq_queue_messages_ready) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Mais de 100 mensagens aguardando na fila do RabbitMQ"

      - alert: EventosNaDeadLetterQueue
        expr: increase(events_failed_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Eventos falharam e foram para a DLQ"
