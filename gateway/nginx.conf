# API Gateway: ponto único de entrada. Roteia /api/* para os micro serviços e o resto para o frontend.
# Quando um serviço tem várias réplicas, o nome DNS resolve para todas e o Nginx distribui as requisições.

log_format json_access escape=json
  '{"time":"$time_iso8601","service":"gateway","level":"info",'
  '"method":"$request_method","uri":"$request_uri","status":$status,'
  '"duration_s":$request_time,"upstream":"$upstream_addr",'
  '"upstream_duration_s":"$upstream_response_time","request_id":"$request_id"}';

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Request-Id $request_id;
proxy_connect_timeout 3s;
proxy_read_timeout 15s;
# Se uma réplica falhar, tenta a próxima (requisições idempotentes).
proxy_next_upstream error timeout http_502 http_503;

server {
  listen 80;
  server_name _;
  client_max_body_size 1m;
  # Definido no server para substituir o access_log padrão (evita linhas duplicadas).
  access_log /dev/stdout json_access;

  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  location = /nginx_status {
    stub_status;
    access_log off;
  }

  location /api/auth/ {
    proxy_pass http://auth-service:3000/;
  }

  location /api/catalog/ {
    proxy_pass http://catalog-service:3000/;
  }

  location /api/bookings/ {
    proxy_pass http://booking-service:3000/;
  }

  location /api/notifications/ {
    proxy_pass http://notification-service:3000/;
  }

  # Métricas e health checks dos serviços não ficam expostos para fora.
  location ~ ^/api/[^/]+/(metrics|ready|health)$ {
    return 404;
  }

  location / {
    proxy_pass http://frontend:80;
  }
}
