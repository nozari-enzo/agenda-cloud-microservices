apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agenda
resources:
  - 00-namespace.yaml
  - 01-config.yaml
  - 10-postgres.yaml
  - 11-rabbitmq.yaml
  - 20-auth-service.yaml
  - 21-catalog-service.yaml
  - 22-booking-service.yaml
  - 23-notification-service.yaml
  - 30-frontend.yaml
  - 31-gateway.yaml

# Senhas vêm de secrets.env, que NÃO vai para o Git (veja secrets.env.example).
secretGenerator:
  - name: agenda-secrets
    envs:
      - secrets.env
generatorOptions:
  disableNameSuffixHash: true
