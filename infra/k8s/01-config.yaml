# Valores de exemplo para ambiente acadêmico. Em produção, use um gerenciador de segredos
# (Sealed Secrets, External Secrets, Vault) em vez de versionar senhas.
apiVersion: v1
kind: Secret
metadata:
  name: agenda-secrets
  namespace: agenda
type: Opaque
stringData:
  POSTGRES_USER: agenda
  POSTGRES_PASSWORD: agenda
  POSTGRES_DB: agenda
  DATABASE_URL: postgresql://agenda:agenda@postgres:5432/agenda
  RABBITMQ_DEFAULT_USER: agenda
  RABBITMQ_DEFAULT_PASS: agenda
  RABBITMQ_URL: amqp://agenda:agenda@rabbitmq:5672
  JWT_SECRET: troque-este-segredo
  ADMIN_EMAIL: admin@agenda.local
  ADMIN_PASSWORD: admin123
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agenda-config
  namespace: agenda
data:
  APP_TIMEZONE: America/Sao_Paulo
  CATALOG_URL: http://catalog-service:3000
